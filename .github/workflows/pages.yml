# Publica la versión de muestra en GitHub Pages cada vez que se sube un cambio a main.
# Dirección: https://<usuario>.github.io/<repositorio>/
name: Publicar propuesta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compilar (modo propuesta, en la ruta del repositorio)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_PROPUESTA: '1'
      - name: Que los buscadores no la indexen
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
